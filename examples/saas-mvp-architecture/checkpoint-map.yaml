      - id: "S-1.1"
        title: "Database Schema Design"
        as_a: "Developer"
        i_want: "Database tables defined"
        so_that: "I have a solid data foundation"
        acceptance_criteria:
          - "User table with all fields"
          - "Tenant table for multi-tenancy"
          - "Role and Permission tables"
          - "Audit log table"
          - "Relationships and indexes defined"
        status: "TODO"

        tasks:
          - id: "T-1.1.1"
            title: "Create User table schema"
            description: "Define User table with id, email, password_hash, google_id, tenant_id, etc."
            acceptance_criteria: "Table created, all fields present"
            estimated_duration: "30min"
            status: "TODO"
            depends_on: []

          - id: "T-1.1.2"
            title: "Create Tenant table schema"
            description: "Define Tenant table with id, name, slug for multi-tenancy"
            acceptance_criteria: "Table created, slug is unique"
            estimated_duration: "30min"
            status: "TODO"
            depends_on: []

          - id: "T-1.1.3"
            title: "Create Role and Permission tables"
            description: "Define Role table and user_roles junction for RBAC"
            acceptance_criteria: "Tables created, junction works"
            estimated_duration: "30min"
            status: "TODO"
            depends_on: []

          - id: "T-1.1.4"
            title: "Create AuditLog table"
            description: "Define audit_logs for security event tracking"
            acceptance_criteria: "Table created, can store events"
            estimated_duration: "20min"
            status: "TODO"
            depends_on: []

          - id: "T-1.1.5"
            title: "Define relationships and indexes"
            description: "Add foreign keys, indexes for performance"
            acceptance_criteria: "Constraints enforced, queries fast"
            estimated_duration: "30min"
            status: "TODO"
            depends_on:
              - "T-1.1.1"
              - "T-1.1.2"
              - "T-1.1.3"
              - "T-1.1.4"

      # ─────────────────────────────────────────────────────────────────────────
      - id: "S-1.2"
        title: "TypeScript Types"
        as_a: "Developer"
        i_want: "Type definitions for all entities"
        so_that: "I get compile-time safety"
        acceptance_criteria:
          - "User entity types defined"
          - "Auth DTOs defined"
          - "Permission enums defined"
        status: "TODO"

        tasks:
          - id: "T-1.2.1"
            title: "Define User entity types"
            description: "Create TypeScript interfaces for User, Tenant"
            acceptance_criteria: "Types compile without errors"
            estimated_duration: "20min"
            status: "TODO"
            depends_on:
              - "T-1.1.1"
              - "T-1.1.2"

          - id: "T-1.2.2"
            title: "Define Auth DTOs"
            description: "Create request/response types for auth endpoints"
            acceptance_criteria: "RegisterDTO, LoginDTO, etc. defined"
            estimated_duration: "20min"
            status: "TODO"
            depends_on:
              - "T-1.2.1"

          - id: "T-1.2.3"
            title: "Define Permission enums"
            description: "Create Role enum (ADMIN, MEMBER, VIEWER)"
            acceptance_criteria: "Enums compile, exhaustive"
            estimated_duration: "15min"
            status: "TODO"
            depends_on:
              - "T-1.1.3"

  # ═══════════════════════════════════════════════════════════════════════════
  # EPIC 2: AUTHENTICATION CORE
  # ═══════════════════════════════════════════════════════════════════════════
  - id: "E-2"
    title: "Authentication Core"
    objective: "Working email/password and OAuth2 authentication"
    acceptance_criteria: "User can register, login, and OAuth"
    status: "TODO"

    stories:
      # ─────────────────────────────────────────────────────────────────────────
      - id: "S-2.1"
        title: "Email/Password Authentication"
        as_a: "User"
        i_want: "To register and login with email/password"
        so_that: "I can access the application"
        acceptance_criteria:
          - "Registration creates user with hashed password"
          - "Login returns valid JWT"
          - "Invalid credentials rejected"
        status: "TODO"

        tasks:
          - id: "T-2.1.1"
            title: "Implement password hashing service"
            description: "Create service using bcrypt for password hashing"
            acceptance_criteria: "Passwords hashed, verified correctly"
            estimated_duration: "30min"
            status: "TODO"
            depends_on:
              - "T-1.2.1"
            warnings:
              - "NEVER use MD5 or SHA for passwords. Use bcrypt only."

          - id: "T-2.1.2"
            title: "Create user repository"
            description: "Implement CRUD operations for users"
            acceptance_criteria: "Can create, read, update users"
            estimated_duration: "45min"
            status: "TODO"
            depends_on:
              - "T-1.1.5"
              - "T-1.2.1"

          - id: "T-2.1.3"
            title: "Implement registration endpoint"
            description: "POST /auth/register creates user"
            acceptance_criteria: "201 returned, user in database"
            estimated_duration: "45min"
            status: "TODO"
            depends_on:
              - "T-2.1.1"
              - "T-2.1.2"

          - id: "T-2.1.4"
            title: "Implement login endpoint"
            description: "POST /auth/login returns JWT"
            acceptance_criteria: "JWT returned on valid credentials"
            estimated_duration: "45min"
            status: "TODO"
            depends_on:
              - "T-2.1.3"
              - "T-2.1.5"

          - id: "T-2.1.5"
            title: "Implement JWT service"
            description: "Create service for JWT generation/verification"
            acceptance_criteria: "Tokens generated and verified"
            estimated_duration: "30min"
            status: "TODO"
            depends_on:
              - "T-1.2.1"
            warnings:
              - "JWT secret must be at least 256 bits"
              - "Always set expiration"

      # ─────────────────────────────────────────────────────────────────────────
      - id: "S-2.2"
        title: "Google OAuth2"
        as_a: "User"
        i_want: "To login with Google"
        so_that: "I don't need another password"
        acceptance_criteria:
          - "Google OAuth flow completes"
          - "New users created on first login"
          - "Existing users linked"
        status: "TODO"

        tasks:
          - id: "T-2.2.1"
            title: "Configure Passport Google strategy"
            description: "Set up Google OAuth2 with Passport"
            acceptance_criteria: "Strategy registered, redirects work"
            estimated_duration: "30min"
            status: "TODO"
            depends_on:
              - "T-2.1.2"

          - id: "T-2.2.2"
            title: "Implement OAuth callback handler"
            description: "Handle Google callback, create/link user"
            acceptance_criteria: "User created/linked, JWT returned"
            estimated_duration: "45min"
            status: "TODO"
            depends_on:
              - "T-2.2.1"
              - "T-2.1.5"

          - id: "T-2.2.3"
            title: "Handle existing email conflicts"
            description: "Proper error when email already exists"
            acceptance_criteria: "Clear error message, no data corruption"
            estimated_duration: "30min"
            status: "TODO"
            depends_on:
              - "T-2.2.2"

  # ═══════════════════════════════════════════════════════════════════════════
  # EPIC 3: RBAC SYSTEM
  # ═══════════════════════════════════════════════════════════════════════════
  - id: "E-3"
