          - id: "T-3.1.2"
            title: "Create permission checking middleware"
            description: "Middleware that checks role before proceeding"
            acceptance_criteria: "Unauthorized users get 403"
            estimated_duration: "45min"
            status: "TODO"
            depends_on:
              - "T-3.1.1"
              - "T-2.1.5"

          - id: "T-3.1.3"
            title: "Implement role hierarchy"
            description: "Admin > Member > Viewer permissions"
            acceptance_criteria: "Higher roles have lower permissions"
            estimated_duration: "30min"
            status: "TODO"
            depends_on:
              - "T-3.1.2"

      # ─────────────────────────────────────────────────────────────────────────
      - id: "S-3.2"
        title: "Protected Routes"
        as_a: "System"
        i_want: "Routes protected by role"
        so_that: "Unauthorized access is prevented"
        acceptance_criteria:
          - "Admin routes protected"
          - "Member routes protected"
          - "Tenant isolation enforced"
        status: "TODO"

        tasks:
          - id: "T-3.2.1"
            title: "Protect admin routes"
            description: "Apply admin-only middleware"
            acceptance_criteria: "Non-admins get 403"
            estimated_duration: "30min"
            status: "TODO"
            depends_on:
              - "T-3.1.2"

          - id: "T-3.2.2"
            title: "Protect member routes"
            description: "Apply member-or-higher middleware"
            acceptance_criteria: "Viewers get 403 on member routes"
            estimated_duration: "30min"
            status: "TODO"
            depends_on:
              - "T-3.1.3"

          - id: "T-3.2.3"
            title: "Implement tenant isolation"
            description: "Ensure users can only access their tenant"
            acceptance_criteria: "Cross-tenant access blocked"
            estimated_duration: "45min"
            status: "TODO"
            depends_on:
              - "T-3.2.1"
            warnings:
              - "Test this exhaustively - security critical"

