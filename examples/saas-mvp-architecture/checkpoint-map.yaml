    objective: "Production-ready security measures"
    acceptance_criteria: "All security tests pass"
    status: "TODO"

    stories:
      # ─────────────────────────────────────────────────────────────────────────
      - id: "S-5.1"
        title: "Security Measures"
        as_a: "System"
