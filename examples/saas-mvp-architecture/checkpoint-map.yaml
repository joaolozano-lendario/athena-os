          - "Permission middleware works"
        status: "TODO"

        tasks:
          - id: "T-3.1.1"
            title: "Implement role assignment service"
            description: "Service to assign/revoke roles"
            acceptance_criteria: "Users can be assigned roles"
            estimated_duration: "30min"
            status: "TODO"
            depends_on:
