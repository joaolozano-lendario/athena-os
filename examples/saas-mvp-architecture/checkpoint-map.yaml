checkpoints:
  - id: "CP-1"
    title: "Schema Validated"
    after_epic: "E-1"
    validation:
      - "All tables created successfully"
      - "Migrations run without errors"
      - "TypeScript types compile"
    action_if_fail: "Review schema, fix errors, re-run migrations"
    updates_state: true

  - id: "CP-2"
    title: "Authentication Working"
    after_epic: "E-2"
    validation:
      - "Registration creates user"
      - "Login returns valid JWT"
      - "Google OAuth completes"
    action_if_fail: "Debug auth flow, check credentials"
    updates_state: true

  - id: "CP-3"
    title: "RBAC Enforced"
    after_epic: "E-3"
    validation:
      - "Admin routes protected"
      - "Member routes protected"
      - "Tenant isolation verified"
    action_if_fail: "Review middleware, test edge cases"
    updates_state: true

  - id: "CP-4"
    title: "Profiles Working"
    after_epic: "E-4"
    validation:
      - "Profile CRUD works"
      - "Avatar upload/delete works"
      - "Password flows work"
    action_if_fail: "Debug specific flow, check storage"
    updates_state: true

  - id: "CP-5"
    title: "Security Verified"
    after_epic: "E-5"
    validation:
      - "Rate limiting active"
      - "Audit logging works"
      - "All security tests pass"
    action_if_fail: "Fix vulnerabilities, re-run tests"
    updates_state: true

