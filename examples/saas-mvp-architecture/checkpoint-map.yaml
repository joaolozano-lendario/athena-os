    objective: "Role-based access control fully functional"
    acceptance_criteria: "Roles restrict access, tenant isolation works"
    status: "TODO"

    stories:
      # ─────────────────────────────────────────────────────────────────────────
      - id: "S-3.1"
        title: "Role Management"
        as_a: "Admin"
        i_want: "To manage user roles"
        so_that: "I can control access"
        acceptance_criteria:
